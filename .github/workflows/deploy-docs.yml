
name: Build & Deploy ESP-Docs (GitHub Pages)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Required for the official Pages deployment flow
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install documentation dependencies
        working-directory: docs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # build-docs fails on any Sphinx warning not listed in
      # docs/sphinx-known-warnings.txt, so this step also gates pull requests.
      - name: Build documentation (ESP‑Docs CLI)
        working-directory: docs
        run: build-docs -l en

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/en/generic/html/


  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    # GitHub Pages runs one deployment at a time. Queue deploys instead of
    # letting a second one fail; a newer queued deploy replaces an older one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
