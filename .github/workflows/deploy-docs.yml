
name: Build & Deploy ESP-Docs (GitHub Pages)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Rebuild after the nightlies so the Image Finder lists the latest images
  # (STM32MP2 finishes about 06:00 UTC, i.MX about 19:30 UTC).
  schedule:
    - cron: '30 6 * * *'
    - cron: '0 21 * * *'

# Required for the official Pages deployment flow
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install documentation dependencies
        working-directory: docs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The Image Finder at /image-finder/ (docs/tools/image-maps/README.md):
      # size and dependency data from the image-maps-data branch, refreshed
      # weekly by refresh-image-maps.yml, plus a daily snapshot of the
      # yocto.cargt.com listings. On a scheduled run a failed snapshot stops
      # the deploy, so the last good list stays up; on other runs the site
      # builds anyway.
      - name: Check out Image Finder map data
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: image-maps-data
          path: docs/image-maps-data

      - name: Read nightly image listings for the Image Finder
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: python3 docs/tools/scan_yocto.py

      - name: Assemble the Image Finder
        run: python3 docs/tools/build_image_finder.py

      # build-docs fails on any Sphinx warning not listed in
      # docs/sphinx-known-warnings.txt, so this step also gates pull requests.
      - name: Build documentation (ESP‑Docs CLI)
        working-directory: docs
        run: build-docs -l en

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/en/generic/html/


  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    # GitHub Pages runs one deployment at a time. Queue deploys instead of
    # letting a second one fail; a newer queued deploy replaces an older one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages sometimes takes more than the default 10 minutes to report
          # a deployment, and the action then cancels it.
          timeout: 1800000
